<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>へしみかハートきゃっち</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💗%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --murasaki: #532F73;
    --murasaki-deep: #3d2255;
    --cream: #fefcf6;
    --panel: #fffaf2;
    --white: #ffffff;
    --line: #eee3d6;
    --shadow: rgba(90,74,66,.14);
    --ink: #5a4a42;
    --soft: #9a887b;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:'Hiragino Maru Gothic ProN','BIZ UDGothic','Yu Gothic',sans-serif;
    background:var(--cream); color:var(--ink);
    display:flex; align-items:flex-start; justify-content:center;
    user-select:none; -webkit-user-select:none;
    min-height:100%; overflow-x:hidden;
  }
  #game {
    width:min(430px,100vw);
    display:flex; flex-direction:column;
    padding:10px 10px 14px;
    gap:10px;
    position:relative;
  }

  .hud {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    align-items:stretch;
  }
  .badge {
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg, #fffdf9 0%, #ffffff 100%);
    border:2px solid var(--line);
    border-radius:22px;
    padding:6px 8px 7px;
    min-width:0;
    min-height:60px;
    text-align:center;
    box-shadow:0 4px 0 var(--shadow);
  }
  .badge::before {
    content:"";
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    right:-10px;
    top:-10px;
    background:rgba(255,255,255,.7);
    pointer-events:none;
  }
  .badge::after {
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    border-radius:50%;
    left:8px;
    bottom:6px;
    background:rgba(255,255,255,.45);
    pointer-events:none;
  }
  .scoreBadge { background:linear-gradient(180deg, #fff7fb 0%, #ffffff 100%); }
  .timeBadge { background:linear-gradient(180deg, #fffaf2 0%, #ffffff 100%); }
  .bestBadge { background:linear-gradient(180deg, #faf8ff 0%, #ffffff 100%); }
  .badge small {
    position:relative;
    z-index:1;
    display:block;
    font-size:10px;
    font-weight:800;
    color:var(--soft);
    letter-spacing:.05em;
    line-height:1.1;
    margin-bottom:2px;
  }
  .scoreBadge small { color:#d9779c; }
  .timeBadge small { color:#af8a48; }
  .bestBadge small { color:#8a6db4; }
  .badge span {
    position:relative;
    z-index:1;
    display:inline-block;
    font-size:18px;
    line-height:1.05;
    font-weight:800;
    letter-spacing:.01em;
    color:var(--murasaki);
    text-shadow:0 1px 0 rgba(255,255,255,.85);
  }
  #timeBadge { color:var(--ink); }
  #timeBadge span { color:#6a4d2e; }
  #timeBadge.hurry { animation:hurryPulse .5s infinite alternate; }
  @keyframes hurryPulse { from{transform:scale(1);} to{transform:scale(1.04);} }

  .panelCard {
    background:rgba(255,250,242,.72);
    border:1px solid #eadfce;
    border-radius:22px;
    box-shadow:0 4px 0 rgba(90,74,66,.10);
    padding:14px 14px 16px;
    backdrop-filter: blur(1px);
  }
  #startScreen {
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .titleBannerWrap {
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
  }
  .titleBanner {
    display:block;
    width:min(80%, 300px);
    height:auto;
  }
  .lead {
    text-align:center;
    font-size:13px;
    font-weight:800;
    color:var(--murasaki);
    line-height:1.35;
  }
  .rule {
    background:var(--white);
    border-radius:18px;
    padding:11px 14px;
    box-shadow:0 3px 0 rgba(90,74,66,.10);
    font-size:12px;
    line-height:1.7;
    text-align:left;
  }

  #cvWrap {
    position:relative;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 5px 0 rgba(90,74,66,.15);
    background:rgba(255,250,242,.45);
  }
  #cv { display:block; width:100%; height:auto; object-fit:contain; touch-action:none; cursor:pointer; }

  .hidden { display:none !important; }

  .overlay {
    position:absolute; inset:0; background:rgba(254,252,246,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; padding:16px; z-index:10;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #resultOverlay { overflow:hidden; gap:8px; padding:12px 14px; }
  .overlay h1 { font-size:22px; color:var(--murasaki); line-height:1.3; }
  .overlay p { font-size:13px; line-height:1.7; }
  .btn {
    font-family:inherit; font-size:17px; font-weight:800; color:#fff;
    background:var(--murasaki); border:none; border-radius:999px;
    padding:12px 32px; cursor:pointer;
    box-shadow:0 5px 0 var(--murasaki-deep);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--murasaki-deep); }
  .startBtnWrap { display:flex; justify-content:center; padding-top:2px; }
  .startBtnWrap .btn { min-width:210px; padding:11px 28px; }

  #resultScore { font-size:24px; font-weight:800; color:var(--murasaki); line-height:1.1; }
  #resultDetail {
    font-size:12.5px; line-height:1.65; opacity:1;
    background:#fff; border-radius:16px; padding:9px 12px;
    box-shadow:0 3px 0 rgba(90,74,66,.10);
    width:min(340px, 96%); color:#5a4a42;
  }
  #resultBest { font-size:12px; opacity:.65; }
  #resultRank {
    font-size:21px; font-weight:800; color:var(--murasaki);
    line-height:1.45; letter-spacing:.02em;
    text-shadow:0 1px 0 rgba(255,255,255,.85);
    margin-top:-2px; margin-bottom:2px;
  }


  /* ===== ランキング ===== */
  .rankLinkBtn {
    border:0;
    background:transparent;
    color:var(--murasaki);
    font-family:inherit;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    padding:6px 10px;
    opacity:.88;
  }
  .rankLinkBtn:hover { opacity:1; text-decoration:underline; }

  .resultRankBtn {
    border:1px solid #dacde7;
    background:#fff;
    color:var(--murasaki);
    font-family:inherit;
    font-size:12.5px;
    font-weight:800;
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(83,47,115,.12);
  }

  #rankingModal {
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(35,28,45,.48);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .rankingCard {
    position:relative;
    width:min(390px, 94vw);
    max-height:min(620px, 90vh);
    overflow:auto;
    background:#fffdf8;
    border:2px solid #eadfce;
    border-radius:24px;
    box-shadow:0 8px 0 rgba(61,34,85,.22);
    padding:20px 18px 18px;
    text-align:center;
  }
  .rankingClose {
    position:absolute;
    right:12px;
    top:9px;
    border:0;
    background:transparent;
    color:#8e7c73;
    font-size:26px;
    line-height:1;
    cursor:pointer;
    padding:4px 7px;
  }
  .rankingTitle {
    color:var(--murasaki);
    font-size:20px;
    margin:2px 28px 12px;
  }
  .rankingSubmitArea {
    background:#fff;
    border-radius:16px;
    box-shadow:0 3px 0 rgba(90,74,66,.10);
    padding:11px 12px 12px;
    margin-bottom:12px;
  }
  .rankingScoreLabel {
    color:var(--murasaki);
    font-size:14px;
    font-weight:800;
    margin-bottom:8px;
  }
  .rankingFormRow {
    display:flex;
    gap:7px;
  }
  #playerNameInput {
    min-width:0;
    flex:1;
    border:1.5px solid #ded3c8;
    border-radius:12px;
    background:#fffdfb;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    padding:9px 10px;
    outline:none;
    user-select:text;
    -webkit-user-select:text;
  }
  #playerNameInput:focus {
    border-color:#9b76b8;
    box-shadow:0 0 0 3px rgba(83,47,115,.09);
  }
  #sendScoreBtn {
    flex:0 0 auto;
    border:0;
    border-radius:12px;
    background:var(--murasaki);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:800;
    padding:9px 13px;
    cursor:pointer;
  }
  #sendScoreBtn:disabled { opacity:.55; cursor:wait; }
  .rankingNote {
    font-size:10.5px;
    color:#8e7c73;
    margin-top:7px;
  }
  #rankingSubmitStatus {
    min-height:18px;
    font-size:11.5px;
    font-weight:700;
    color:var(--murasaki);
    margin-top:7px;
  }
  #rankingStatus {
    font-size:12px;
    color:#8e7c73;
    min-height:18px;
    margin:4px 0 8px;
  }
  #rankingList {
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:0;
    margin:0;
  }
  .rankingRow {
    display:grid;
    grid-template-columns:42px 1fr auto;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid #f0e6dc;
    border-radius:13px;
    padding:8px 10px;
    text-align:left;
  }
  .rankingPlace {
    font-weight:900;
    color:#8b6aa6;
    text-align:center;
  }
  .rankingName {
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
    font-weight:700;
  }
  .rankingScore {
    color:var(--murasaki);
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
  }

  @media (max-width: 420px) {
    #game { padding:8px 8px 12px; gap:8px; }
    .badge { border-radius:18px; padding:5px 6px 6px; min-height:54px; }
    .badge span { font-size:17px; }
    .badge small { font-size:9.5px; }
    .panelCard { padding:12px 12px 14px; }
    .titleBanner { width:min(78%, 280px); }
    .lead { font-size:12px; }
    .rule { font-size:11.2px; padding:10px 12px; line-height:1.65; }
  }
</style>
</head>
<body>
<div id="game">
  <div class="hud">
    <div class="badge scoreBadge"><small>💗 スコア</small><span id="score">0</span></div>
    <div class="badge timeBadge" id="timeBadge"><small>🌙 のこり</small><span id="time">30</span>秒</div>
    <div class="badge bestBadge"><small>✨ ベスト</small><span id="best">0</span></div>
  </div>

  <section id="startScreen" class="panelCard">
    <div class="titleBannerWrap">
      <img class="titleBanner" src="title_banner.png" alt="🍆へしみか🌙　💗ハートきゃっち💗">
    </div>
    <p class="lead">30秒、ひとつ残らず受け止めよ！</p>
    <div class="rule">
      👆 ドラッグ / ←→キーで長谷部をうごかす<br>
      💗 三日月の投げるハートをキャッチ <b>+10</b><br>
      🌙 たまに投げてくる月は <b>+30</b>！<br>
      🔥 連続キャッチでコンボボーナス<br>
      💧 とりこぼすとコンボが切れる…<br>
      👤「たまに -100 になる驚きのものが…気をつけてくれ！」
    </div>
    <div class="startBtnWrap">
      <button class="btn" id="startBtn">主命とあらば！</button>
    </div>
    <button class="rankLinkBtn" id="openRankingBtn" type="button">🏆 ランキングを見る</button>
  </section>

  <div id="cvWrap" class="hidden">
    <canvas id="cv" width="400" height="380"></canvas>

    <div class="overlay hidden" id="resultOverlay">
      <div id="resultScore">0</div>
      <div id="resultRank"></div>
      <div id="resultDetail"></div>
      <div id="resultBest"></div>
      <button class="resultRankBtn" id="registerScoreBtn" type="button">🏆 ランキングに登録</button>
      <p style="font-size:12px;color:#7a6b64;opacity:.75;margin-top:0px;">もういちどやる？</p>
      <button class="btn" id="retryBtn">まだ行けますよ</button>
    </div>
  </div>

  <div id="rankingModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="rankingTitle">
    <div class="rankingCard">
      <button class="rankingClose" id="closeRankingBtn" type="button" aria-label="閉じる">×</button>
      <h2 class="rankingTitle" id="rankingTitle">🏆 へしみかランキング</h2>

      <div class="rankingSubmitArea hidden" id="rankingSubmitArea">
        <div class="rankingScoreLabel" id="rankingScoreLabel">今回のスコア</div>
        <div class="rankingFormRow">
          <input id="playerNameInput" type="text" maxlength="16" autocomplete="nickname"
                 placeholder="なまえ（16文字まで）">
          <button id="sendScoreBtn" type="button">登録</button>
        </div>
        <div class="rankingNote">表示名はランキングに公開されます</div>
        <div id="rankingSubmitStatus"></div>
      </div>

      <div id="rankingStatus">読み込み中…</div>
      <ol id="rankingList"></ol>
    </div>
  </div>

</div>

<script>

/* =========================================================
   みかづきさまのおくりもの — へしみかキャッチ(趣味・非公開用)
   三日月が上からハートを投げ、長谷部がキャッチする30秒。外部PNG差分対応版。
   ラスト5秒は「大盤振る舞い」で月も増える。
   ========================================================= */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ===== パレット(アイテム用) =====
const PAL = {
  H:'#F06292', h:'#F8A5C0',      // ハート
  G:'#D4B24C', W:'#F0F0F0'       // 月ときらめき
};

// ===== キャラスプライト（HTMLと同じフォルダのPNGを読み込む） =====
function loadSprite(src){
  const img = new Image();
  img.src = src;
  return img;
}

const SPRITES = {
  mika_start:      loadSprite('mika_start.png'),
  mika_left:       loadSprite('mika_left.png'),
  mika_right:      loadSprite('mika_right.png'),
  mika_rush:       loadSprite('mika_rush.png'),

  hesi_start:      loadSprite('hesi_start.png'),
  hesi_left:       loadSprite('hesi_left.png'),
  hesi_right:      loadSprite('hesi_right.png'),
  hesi_rush_front: loadSprite('hesi_rush_front.png'),
  hesi_rush_back:  loadSprite('hesi_rush_back.png'),

  // おはぎトラップ
  ohagi:           loadSprite('ohagi.png'),
  hesi_ohagi:      loadSprite('hesi_ohagi.png'),
};

// 512×512の透過PNGを、ゲーム内ではこの大きさで描画
const HESI_W = 110, HESI_H = 110;
const MIKA_W = 118, MIKA_H = 118;
// 見た目だけ少し大きく（当たり判定・ゲームバランスは変更しない）
const HESI_DRAW_W = 132, HESI_DRAW_H = 132;
const MIKA_DRAW_W = 136, MIKA_DRAW_H = 136;

// ===== アイテム =====
const HEART = [
  ".HH.HH.",
  "HhHHHhH",
  "HHHHHHH",
  ".HHHHH.",
  "..HHH..",
  "...H..."
];
const MOON = [
  "..GGGG.",
  ".GGG...",
  "GGG....",
  "GGG....",
  "GGG....",
  ".GGG...",
  "..GGGG."
];

// ===== 描画ユーティリティ =====
function drawMap(map, x, y, spr) {
  for (let r=0; r<map.length; r++) {
    const row = map[r];
    for (let c=0; c<row.length; c++) {
      const col = PAL[row[c]];
      if (col) { ctx.fillStyle=col; ctx.fillRect(x+c*spr, y+r*spr, spr, spr); }
    }
  }
}

// ===== 効果音 =====
let audioCtx=null;
function sound(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime;
    const mk=(type,f0,f1,dur,vol,delay=0)=>{
      const o=audioCtx.createOscillator(), gn=audioCtx.createGain();
      o.connect(gn); gn.connect(audioCtx.destination);
      o.type=type; o.frequency.setValueAtTime(f0,t+delay);
      if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+delay+dur);
      gn.gain.setValueAtTime(vol,t+delay);
      gn.gain.exponentialRampToValueAtTime(.001,t+delay+dur);
      o.start(t+delay); o.stop(t+delay+dur+.02);
    };
    if (kind==='heart'){ mk('sine',740,988,.12,.07); }
    else if (kind==='moon'){ [784,1047,1319].forEach((f,i)=>mk('triangle',f,null,.2,.08,i*.08)); }
    else if (kind==='miss'){ mk('sine',330,220,.15,.04); }
    else if (kind==='rush'){ [523,659,523,1047].forEach((f,i)=>mk('square',f,null,.11,.08,i*.1)); }
    else if (kind==='end'){ [523,659,784,1047].forEach((f,i)=>mk('triangle',f,null,.25,.09,i*.12)); }
  } catch(e){}
}

// ===== 定数 =====
const SPR = 3;
const GAME_TIME = 30;
const RUSH_AT = 9.5;               // 残り約9.5秒で長谷部→三日月の予告 → 演出後、ラスト約5〜6秒が大盤振る舞い
const STAND_Y = 350;               // 長谷部の足の位置
const CHAR_W = 78;       // 長谷部の実キャラ部分の当たり幅

// ===== 状態 =====
let playing=false;
let frame=0, startTime=0, timeLeft=GAME_TIME;
let hx=W/2, tx=W/2;                // 長谷部の位置と目標
let mx=W/2, mTarget=W/2, mBob=0;   // 三日月の位置
let happyT=0;                      // 長谷部キャッチ時のぴょこっタイマー
let smileT=0;                      // 三日月投げ動作のぴょこっタイマー
let mikaPoseT=0;                   // 通常時の左右投げポーズ表示時間
let mikaThrowDir=1;                // -1:左投げ / +1:右投げ
let hesiMoveDir=0;                 // -1:左移動 / 0:停止 / +1:右移動
let throwIn=50, rushOn=false, rushShown=false, rushCued=false, rushHold=0, rushBannerT=0;
let rushMikaSaid=false;             // 大盤振る舞い前の三日月セリフを1回だけ
let introStage=0, introT=0;              // 1:静止 2:三日月 3:長谷部 / 0:ゲーム本編
let hesiCatchSaid=false;            // 大盤振る舞い前に長谷部のキャッチ台詞を最低1回
let ohagiPauseUntil=0, ohagiPauseLast=0; // 通常時のおはぎ誤キャッチ停止
let rushOhagiT=0;                        // 大盤振る舞い中のおはぎリアクション
const OHAGI_PAUSE_MS=1800;
const RUSH_OHAGI_FRAMES=28;              // 約0.45秒だけ専用絵を表示
let score=0, best=0, combo=0, maxCombo=0;
let hearts=0, moons=0, missed=0, ohagiCount=0;
let items=[];                      // {x,y,vx,vy,type:'heart'|'moon'|'ohagi'}
let fx=[];                         // スコアポップ
let bubble=null;                   // 三日月のひとこと {text, life}
let hesiBubble=null;               // 長谷部のひとこと {text, life}
let rafId=null;

const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const timeBadge=document.getElementById('timeBadge');
const bestEl=document.getElementById('best');


// ===== オンラインランキング（Supabase Edge Function） =====
const LEADERBOARD_API = 'https://ukuxypngootnncxwtgdg.supabase.co/functions/v1/leaderboard-api';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JliqWzWc5shbQidiaXrOrA_nKpKUKJ3';

const rankingModal = document.getElementById('rankingModal');
const rankingSubmitArea = document.getElementById('rankingSubmitArea');
const rankingStatus = document.getElementById('rankingStatus');
const rankingSubmitStatus = document.getElementById('rankingSubmitStatus');
const rankingList = document.getElementById('rankingList');
const rankingScoreLabel = document.getElementById('rankingScoreLabel');
const playerNameInput = document.getElementById('playerNameInput');
const sendScoreBtn = document.getElementById('sendScoreBtn');

function storageGet(key){
  try { return localStorage.getItem(key); } catch(e) { return null; }
}
function storageSet(key, value){
  try { localStorage.setItem(key, value); } catch(e) {}
}
function makeUuid(){
  if (window.crypto && typeof window.crypto.randomUUID === 'function'){
    return window.crypto.randomUUID();
  }
  // RFC4122 v4 fallback
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function getPlayerId(){
  let id=storageGet('heshimika_player_id');
  const uuidRe=/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  if (!id || !uuidRe.test(id)){
    id=makeUuid();
    storageSet('heshimika_player_id', id);
  }
  return id;
}

async function leaderboardRequest(method='GET', body=null){
  const options={
    method,
    headers:{
      'apikey': SUPABASE_PUBLISHABLE_KEY,
      'Content-Type':'application/json'
    }
  };
  if (body) options.body=JSON.stringify(body);

  const res=await fetch(LEADERBOARD_API, options);
  let data={};
  try { data=await res.json(); } catch(e) {}
  if (!res.ok){
    throw new Error(data.error || data.message || `HTTP ${res.status}`);
  }
  return data;
}

function renderLeaderboard(rows){
  rankingList.replaceChildren();

  if (!Array.isArray(rows) || rows.length===0){
    const empty=document.createElement('li');
    empty.className='rankingRow';
    empty.style.gridTemplateColumns='1fr';
    empty.style.textAlign='center';
    empty.textContent='まだランキングは空っぽです';
    rankingList.appendChild(empty);
    return;
  }

  const medals=['🥇','🥈','🥉'];
  rows.slice(0,10).forEach((row, index)=>{
    const li=document.createElement('li');
    li.className='rankingRow';

    const place=document.createElement('div');
    place.className='rankingPlace';
    place.textContent=medals[index] || `${index+1}位`;

    const name=document.createElement('div');
    name.className='rankingName';
    name.textContent=String(row.player_name ?? 'ななし');

    const sc=document.createElement('div');
    sc.className='rankingScore';
    sc.textContent=`${Number(row.score)||0}てん`;

    li.append(place, name, sc);
    rankingList.appendChild(li);
  });
}

async function loadLeaderboard(){
  rankingStatus.textContent='ランキング読み込み中…';
  rankingList.replaceChildren();
  try {
    const data=await leaderboardRequest('GET');
    renderLeaderboard(data.leaderboard || []);
    rankingStatus.textContent='';
  } catch(err){
    rankingStatus.textContent='ランキングにつながりませんでした。少し待ってもう一度お試しください。';
    console.error('leaderboard GET:', err);
  }
}

function openRanking(mode='view'){
  rankingModal.classList.remove('hidden');
  rankingSubmitStatus.textContent='';

  const savedName=storageGet('heshimika_player_name') || '';
  playerNameInput.value=savedName;

  if (mode==='submit'){
    rankingSubmitArea.classList.remove('hidden');
    rankingScoreLabel.textContent=`今回のスコア：${score}てん`;
  } else {
    rankingSubmitArea.classList.add('hidden');
  }

  loadLeaderboard();
}

function closeRanking(){
  rankingModal.classList.add('hidden');
}

async function submitCurrentScore(){
  const name=playerNameInput.value.trim();
  if (!name){
    rankingSubmitStatus.textContent='なまえを入れてください';
    playerNameInput.focus();
    return;
  }
  if ([...name].length>16){
    rankingSubmitStatus.textContent='なまえは16文字までです';
    return;
  }

  sendScoreBtn.disabled=true;
  rankingSubmitStatus.textContent='登録中…';

  try {
    const data=await leaderboardRequest('POST', {
      player_id:getPlayerId(),
      player_name:name,
      score:Math.max(0, Math.floor(score))
    });

    storageSet('heshimika_player_name', name);

    if (data.new_best){
      rankingSubmitStatus.textContent='✨ 自己ベスト更新！ 登録しました';
    } else if (typeof data.best_score==='number'){
      rankingSubmitStatus.textContent=`登録済み！ 自己ベストは ${data.best_score}てん`;
    } else {
      rankingSubmitStatus.textContent='登録しました！';
    }

    await loadLeaderboard();
  } catch(err){
    rankingSubmitStatus.textContent='登録できませんでした。少し待ってもう一度お試しください。';
    console.error('leaderboard POST:', err);
  } finally {
    sendScoreBtn.disabled=false;
  }
}

document.getElementById('openRankingBtn').addEventListener('click', ()=>openRanking('view'));
document.getElementById('registerScoreBtn').addEventListener('click', ()=>openRanking('submit'));
document.getElementById('closeRankingBtn').addEventListener('click', closeRanking);
sendScoreBtn.addEventListener('click', submitCurrentScore);
playerNameInput.addEventListener('keydown', e=>{

});
rankingModal.addEventListener('pointerdown', e=>{

});
document.addEventListener('keydown', e=>{

function updateHUD(){
  scoreEl.textContent=score;

}

// ===== 星空 =====
const stars = Array.from({length:26},(_,i)=>({x:(i*67)%400, y:(i*41)%230, tw:i%3}));

// ===== 三日月のひとこと =====
function say(text, life=100){ bubble={text, life}; }
function hesiSay(text, life=90, pos='side'){ hesiBubble={text, life, pos}; }

// ===== 投げる =====
const MIKA_LINES = ['うけとれ', '受け取れ', 'なかなかやるな', 'よきかなよきかな', 'はっはっは', 'よいぞよいぞ', 'はいっ！'];
const HESI_CATCH = ['だからぁ？', 'っ…ははっ'];
function randomItemType(){
  // おはぎは「たまに」。大盤振る舞い中も少しだけ混ざる。
  const ohagiRate = rushOn ? 0.11 : 0.08;
  const moonRate = rushOn ? 0.28 : 0.12;
  const r = Math.random();
  if (r < ohagiRate) return 'ohagi';
  if (r < ohagiRate + moonRate) return 'moon';
  return 'heart';
}

function throwItem(){
  const type = randomItemType();

  // 左右の手を交互に使う。通常時はこの向きの差分を少しだけ表示。
  mikaThrowDir *= -1;
  mikaPoseT = 15;

  if (rushOn){
    if (Math.random()<0.35) say('はいっ！', 45);
  } else if (type==='moon'){
    say(Math.random()<0.5 ? 'これでどうだ' : 'これも受け取れ');
  } else if (type==='heart' && Math.random()<0.3){
    say(MIKA_LINES[Math.floor(Math.random()*MIKA_LINES.length)]);
  }

  // 手元付近から落ち始める。左右のポーズに合わせて少し横へ飛ばす。
  const handX = mx + mikaThrowDir * 28;
  const handY = 14 + mBob + MIKA_H * 0.56;
  const sideV = mikaThrowDir * (0.55 + Math.random()*0.55);

  items.push({
    x: handX - 10,
    y: handY,
    vx: sideV,
    vy: 1.45,
    type
  });

  // たまに2個いっぺんに
  if (Math.random() < (rushOn?0.6:0.25)){
    const t2 = randomItemType();
    items.push({
      x: handX + (Math.random()*16-8) - 10,
      y: handY - 5,
      vx: sideV * 0.75 + (Math.random()*0.5-0.25),
      vy: 1.25,
      type:t2
    });
  }

  smileT=22;
  throwIn = rushOn ? (10+Math.random()*8) : (30+Math.random()*20);
}

// ===== メインループ =====
function loop(){
  frame++;

  // ===== 開始演出 =====
  // ① 約1秒静止 → ② 三日月「へしみかはじめよう」
  // → ③ 長谷部「主の命とあらば」 → ④ ここで30秒タイマー開始
  if (introStage>0){
    timeLeft=GAME_TIME;

    if (bubble && --bubble.life<=0) bubble=null;
    if (hesiBubble && --hesiBubble.life<=0) hesiBubble=null;

    introT--;

    if (introStage===1 && introT<=0){
      introStage=2;
      introT=85;
      say('へしみかはじめよう', 85);
    } else if (introStage===2 && introT<=0){
      bubble=null;
      introStage=3;
      introT=80;
      hesiSay('主の命とあらば', 80, 'top');
    } else if (introStage===3 && introT<=0){
      hesiBubble=null;
      introStage=0;
      startTime=performance.now();
      throwIn=35;
    }

    render();
    updateHUD();
    if (playing) rafId=requestAnimationFrame(loop);
    return;
  }

  // ===== おはぎ誤キャッチ演出 =====
  // 大盤振る舞い前だけ、約1.8秒すべてを止めて長谷部に言わせる。
  // 停止中はゲーム時間も減らさない。
  if (ohagiPauseUntil>0){
    const now=performance.now();
    if (now < ohagiPauseUntil){
      startTime += Math.max(0, now-ohagiPauseLast);
      ohagiPauseLast=now;
      timeLeft=Math.max(0, GAME_TIME-(now-startTime)/1000);
      render();
      updateHUD();
      if (playing) rafId=requestAnimationFrame(loop);
      return;
    } else {
      startTime += Math.max(0, ohagiPauseUntil-ohagiPauseLast);
      ohagiPauseUntil=0;
      ohagiPauseLast=0;
      hesiBubble=null;
    }
  }

  timeLeft=Math.max(0, GAME_TIME-(performance.now()-startTime)/1000);
  if (happyT>0) happyT--;
  if (smileT>0) smileT--;
  if (mikaPoseT>0) mikaPoseT--;
  if (rushOhagiT>0) rushOhagiT--;
  if (bubble && --bubble.life<=0) bubble=null;
  if (hesiBubble && --hesiBubble.life<=0) hesiBubble=null;

  // 大盤振る舞い前：長谷部 → 三日月 → 中央演出 → 怒涛スタート
  if (timeLeft<=RUSH_AT && !rushCued){
    rushCued=true;
    rushMikaSaid=false;
    rushHold=170;                         // 約2.8秒：長谷部75f → 三日月95f
    bubble=null;
    hesiBubble=null;
    hesiSay('主への手土産ができたな', 75, 'top');
  }
  if (rushHold>0){
    rushHold--;
    if (rushHold===95 && !rushMikaSaid){  // 長谷部のあと、三日月
      rushMikaSaid=true;
      hesiBubble=null;
      say('暑いな…本気になるか', 95);
    }
    if (rushHold===0){                    // セリフ終了 → 「大盤振る舞い！」をドン！
      bubble=null;
      hesiBubble=null;
      rushBannerT=48;                     // 約0.8秒、中央の縦演出
      sound('rush');
    }
  } else if (rushBannerT>0){
    rushBannerT--;
    if (rushBannerT===0){                 // 演出終了 → 怒涛スタート！
      rushOn=true; rushShown=true;
      throwIn=4;
      hesiSay('はぁぁあ！', 72);          // 大盤振る舞い開始の気合い
    }
  }

  // 長谷部移動：移動方向に合わせて差分を切り替える
  const hesiDx = tx-hx;
  hesiMoveDir = Math.abs(hesiDx)>1.6 ? (hesiDx<0 ? -1 : 1) : 0;
  hx += hesiDx*0.22;
  hx = Math.max(CHAR_W/2+4, Math.min(W-CHAR_W/2-4, hx));

  // 三日月ふよふよ移動
  if (frame%120===0 || Math.abs(mx-mTarget)<4) mTarget = 60 + Math.random()*(W-120);
  mx += (mTarget-mx)*0.02;
  mBob = Math.sin(frame*0.05)*4;

  throwIn--;
  if (throwIn<=0 && timeLeft>0.5 && rushHold<=0 && rushBannerT<=0) throwItem();

  // アイテム落下+キャッチ判定
  const cy0 = STAND_Y-HESI_H, cy1 = STAND_Y-HESI_H*0.42;   // 長谷部の上半身
  const frozen = rushHold>0 || rushBannerT>0;                 // タメ＆大盤振る舞い演出中は空中で静止
  for (const it of items){
    if (!frozen){
      it.y += it.vy;
      it.x += it.vx;
      it.vy += 0.07;                                     // ぐんぐん加速
    }
    if (frozen) continue;              // タメ中は判定もしない(完全に静止)
    if (it.x<10||it.x>W-24) it.vx*=-1;                 // 端で跳ね返る
    const itemHalf = it.type==='ohagi' ? 14 : 10;
    const cx=it.x+itemHalf, cyy=it.y+(it.type==='ohagi'?14:9);
    if (cyy>=cy0 && cyy<=cy1 && Math.abs(cx-hx)<CHAR_W/2+4){
      it.got=true;

      // おはぎは減点トラップ。避ければノーペナルティ。
      if (it.type==='ohagi'){
        combo=0;
        ohagiCount++;
        score=Math.max(0, score-100);
        sound('miss');
        fx.push({x:it.x, y:cy0-8, text:'-100',
                 color:'#8a4c62', life:46});

        // 大盤振る舞い前：全体を止めて長いリアクション。
        if (!rushOn && !rushCued && introStage===0){
          const now=performance.now();
          ohagiPauseLast=now;
          ohagiPauseUntil=now+OHAGI_PAUSE_MS;
          bubble=null;
          hesiBubble=null;
          hesiSay('げほっげほっ！くそっ、おはぎか！', 9999, 'top');
        }

        // 大盤振る舞い中：止めない。専用絵＋短い悲鳴だけ。
        if (rushOn){
          rushOhagiT=RUSH_OHAGI_FRAMES;
          const cries=['ぐはっ！','うわっ！'];
          hesiSay(cries[Math.floor(Math.random()*cries.length)], RUSH_OHAGI_FRAMES, 'side');
        }
      } else {
        combo++; maxCombo=Math.max(maxCombo,combo);
        const bonus=Math.min(combo-1,5)*2;
        const base=it.type==='moon'?30:10;
        score+=base+bonus;
        if (it.type==='moon'){ moons++; sound('moon'); }
        else { hearts++; sound('heart'); }
        happyT=30;
        if (!rushCued && introStage===0 && (!hesiCatchSaid || Math.random()<0.18)){
          hesiCatchSaid=true;
          hesiSay(HESI_CATCH[Math.floor(Math.random()*HESI_CATCH.length)], 50, 'side');
        }
        fx.push({x:it.x, y:cy0-8, text:`+${base+bonus}`,
                 color: it.type==='moon'?'#c9932b':'#e0508a', life:36});
      }
    }
    if (!it.got && it.y>H){
      it.miss=true;
      // おはぎを避けるのは正解なので、miss扱いにしない
      if (it.type!=='ohagi'){
        missed++;
        combo=0;
        sound('miss');
      }
    }
  }
  items=items.filter(it=>!it.got && !it.miss);
  for (const f of fx){ f.y-=0.8; f.life--; }
  fx=fx.filter(f=>f.life>0);

  render();
  updateHUD();

  if (timeLeft<=0 && items.length===0){ endGame(); return; }
  if (playing) rafId=requestAnimationFrame(loop);
}

// ===== 描画 =====
function render(){
  // 夜空
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#232f4d'); grad.addColorStop(0.7,'#3d4a73'); grad.addColorStop(1,'#54476b');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  // 星
  ctx.fillStyle='#f0ead2';
  for (const s of stars){
    if ((frame>>4)%3===s.tw) continue;   // またたき
    ctx.fillRect(s.x, s.y, 2, 2);
  }
  // 芝生
  ctx.fillStyle='#5f9d4f'; ctx.fillRect(0, STAND_Y+2, W, H-STAND_Y);
  ctx.fillStyle='#8cd06b'; ctx.fillRect(0, STAND_Y-4, W, 6);
  ctx.fillStyle='#72b457';
  for(let x=0;x<W;x+=44) ctx.fillRect(x, STAND_Y+2, 2, H-STAND_Y);

  // 三日月
  // 通常：待機 / 左投げ / 右投げ
  // 大盤振る舞い：start と rush を高速交互表示 → 両手でバンバン投げる動き
  let mikaImg = SPRITES.mika_start;
  if (rushOn){
    mikaImg = (Math.floor(frame/14)%2===0) ? SPRITES.mika_start : SPRITES.mika_rush;
  } else if (mikaPoseT>0){
    mikaImg = mikaThrowDir<0 ? SPRITES.mika_left : SPRITES.mika_right;
  }
  if (mikaImg.complete && mikaImg.naturalWidth){
    const hop = smileT>16 ? -3 : 0;
    // 元PNGはそのまま。表示だけ少し大きく＋軽く締める
    const drawY = 4+mBob+hop-(MIKA_DRAW_H-MIKA_H); // 雲の下端位置は従来と同じ
    ctx.save();
    ctx.filter='saturate(1.10) contrast(1.07)';
    ctx.shadowColor='rgba(8,12,28,.38)';
    ctx.shadowBlur=7;
    ctx.shadowOffsetY=3;
    ctx.drawImage(mikaImg, mx-MIKA_DRAW_W/2, drawY, MIKA_DRAW_W, MIKA_DRAW_H);
    ctx.restore();
  }

  // ふきだし(三日月のすぐ下に大きめ)
  if (bubble){
    ctx.font='bold 15px sans-serif';
    const w=ctx.measureText(bubble.text).width+20;
    const bx=Math.min(W-w-6, Math.max(6, mx-w/2));
    const by=6+MIKA_H+mBob-1;
    ctx.globalAlpha=Math.min(1, bubble.life/15);
    // しっぽ(上向き)
    ctx.fillStyle='rgba(251,248,238,.96)';
    ctx.beginPath();
    ctx.moveTo(mx-6, by); ctx.lineTo(mx+6, by); ctx.lineTo(mx, by-7); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.roundRect(bx, by, w, 24, 10); ctx.fill();
    ctx.fillStyle='#3d2255';
    ctx.textBaseline='middle';
    ctx.fillText(bubble.text, bx+10, by+13);
    ctx.globalAlpha=1;
  }

  // アイテム
  for (const it of items){
    if (it.type==='ohagi'){
      const oi=SPRITES.ohagi;
      if (oi.complete && oi.naturalWidth){
        ctx.drawImage(oi, it.x-2, it.y-2, 32, 32);
      } else {
        ctx.fillStyle='#744a59';
        ctx.beginPath(); ctx.arc(it.x+14,it.y+14,12,0,Math.PI*2); ctx.fill();
      }
    } else if (it.type==='moon'){
      drawMap(MOON, it.x, it.y, SPR);
      if (frame%16<8){ ctx.fillStyle=PAL.W; ctx.fillRect(it.x+22, it.y+2, 3, 3); }
    } else {
      drawMap(HEART, it.x, it.y, SPR);
    }
  }

  // 長谷部
  // 通常：前向きの移動絵を左右反転して使用（後ろ姿は使わない）
  // 大盤振る舞い中：汗だくの前向き絵を左右反転して使用
  let hesiImg = SPRITES.hesi_start;
  let hesiFlip = false;
  if (ohagiPauseUntil>0 || rushOhagiT>0){
    hesiImg = SPRITES.hesi_ohagi;
  } else if (rushOn){
    hesiImg = SPRITES.hesi_rush_front;
    hesiFlip = hesiMoveDir > 0;
  } else if (rushHold>0 || rushBannerT>0){
    hesiImg = SPRITES.hesi_start;
  } else if (hesiMoveDir<0){
    hesiImg = SPRITES.hesi_left;
  } else if (hesiMoveDir>0){
    hesiImg = SPRITES.hesi_left;
    hesiFlip = true;
  }

  if (hesiImg.complete && hesiImg.naturalWidth){
    const hop = happyT>24 ? -3 : 0;
    const drawY = STAND_Y-HESI_DRAW_H+hop; // 足元位置は従来と同じ
    ctx.save();
    ctx.filter='saturate(1.10) contrast(1.07)';
    ctx.shadowColor='rgba(8,12,28,.42)';
    ctx.shadowBlur=7;
    ctx.shadowOffsetY=3;
    if (hesiFlip){
      ctx.translate(hx, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(hesiImg, -HESI_DRAW_W/2, drawY, HESI_DRAW_W, HESI_DRAW_H);
    } else {
      ctx.drawImage(hesiImg, hx-HESI_DRAW_W/2, drawY, HESI_DRAW_W, HESI_DRAW_H);
    }
    ctx.restore();
  }
  if (happyT>18 && ohagiPauseUntil<=0 && rushOhagiT<=0){ ctx.font='14px sans-serif'; ctx.fillText('💗', hx+HESI_DRAW_W/2-4, STAND_Y-HESI_DRAW_H+5); }

  // 長谷部のふきだし：通常は横／「主への手土産ができたな」は頭上
  if (hesiBubble){
    ctx.font='bold 13px sans-serif';
    const w=ctx.measureText(hesiBubble.text).width+18;
    ctx.globalAlpha=Math.min(1, hesiBubble.life/15);
    ctx.fillStyle='rgba(83,47,115,.95)';

    if (hesiBubble.pos==='top'){
      // 大盤振る舞い前はアイテム停止中なので、頭上に大きく出す
      const bx=Math.min(W-w-6, Math.max(6, hx-w/2));
      const by=STAND_Y-HESI_DRAW_H-24;
      ctx.beginPath();
      ctx.moveTo(hx-6, by+22); ctx.lineTo(hx+6, by+22); ctx.lineTo(hx, by+29); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.roundRect(bx, by, w, 22, 9); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textBaseline='middle';
      ctx.fillText(hesiBubble.text, bx+9, by+12);
    } else {
      // キャッチ中の「だからぁ？」「っ…ははっ」などは横に出す
      const h=24, gap=9;
      const rightX=hx+41+gap;
      const leftX=hx-41-gap-w;
      const onRight=(rightX+w<=W-6);
      const bx=onRight ? rightX : Math.max(6,leftX);
      const by=Math.max(8, STAND_Y-HESI_DRAW_H*0.68-h/2);
      const tipX=onRight ? hx+40 : hx-40;
      const edgeX=onRight ? bx : bx+w;
      const midY=by+h/2;
      ctx.beginPath();
      ctx.moveTo(edgeX, midY-6); ctx.lineTo(edgeX, midY+6); ctx.lineTo(tipX, midY); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.roundRect(bx, by, w, h, 9); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textBaseline='middle';
      ctx.fillText(hesiBubble.text, bx+9, by+h/2+1);
    }
    ctx.globalAlpha=1;
  }

  // スコアポップ
  ctx.font='bold 13px monospace'; ctx.textBaseline='middle';
  for (const f of fx){
    ctx.globalAlpha=Math.min(1, f.life/18);
    ctx.fillStyle=f.color;
    ctx.fillText(f.text, f.x-6, f.y);
    ctx.globalAlpha=1;
  }
  // コンボ
  if (combo>=2 && playing){
    ctx.font='bold 15px monospace';
    ctx.fillStyle='#f0d9a8';
    ctx.fillText(`${combo} combo!💗`, W-118, 96);
  }


  // 大盤振る舞い演出（中央の縦帯。会心の一撃風にドン！）
  if (rushBannerT>0){
    const maxT=48;
    const age=maxT-rushBannerT;
    const pop=Math.min(1, age/7);
    const fade=Math.min(1, rushBannerT/10);
    const scale=0.84+0.16*pop;
    const chars=['大','盤','振','る','舞','い','！'];

    ctx.save();
    ctx.globalAlpha=fade;
    ctx.translate(W/2, H/2);
    ctx.scale(scale, scale);

    // 縦長の暗い帯＋金色の発光
    const bw=78, bh=264;
    const grd=ctx.createLinearGradient(-bw/2,0,bw/2,0);
    grd.addColorStop(0,'rgba(21,13,33,.20)');
    grd.addColorStop(.20,'rgba(42,24,63,.90)');
    grd.addColorStop(.50,'rgba(28,17,46,.96)');
    grd.addColorStop(.80,'rgba(42,24,63,.90)');
    grd.addColorStop(1,'rgba(21,13,33,.20)');
    ctx.fillStyle=grd;
    ctx.fillRect(-bw/2,-bh/2,bw,bh);

    ctx.strokeStyle='rgba(240,211,111,.72)';
    ctx.lineWidth=2;
    ctx.strokeRect(-bw/2+4,-bh/2+4,bw-8,bh-8);

    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font='900 29px "Yu Mincho","Hiragino Mincho ProN",serif';
    ctx.fillStyle='#fff6c7';
    ctx.shadowColor='#f0d36f';
    ctx.shadowBlur=18;
    const step=32;
    const startY=-(chars.length-1)*step/2;
    chars.forEach((ch,i)=>ctx.fillText(ch,0,startY+i*step));

    ctx.restore();
  }
}

// ===== 終了 =====
function endGame(){
  playing=false;
  if (score>best) best=score;
  sound('end');
  // 結果セリフはすべて公式ボイス原文のみ
  const LOW_RANK = [
    'いえ……こんなはずでは……',
    'これは練習です！',
    '申し訳ございません……',
    'これは何かの策ですか？',
  ];
  const NORMAL_RANK = [
    '任務が達成されましたよ。ご確認を',
    '完成致しました。お納めください',
  ];
  const GOOD_RANK = [
    '主命を果たしたまでのことです',
    '結果を出すのは当然です',
    '切れ味が冴えますね',
  ];
  const BEST_RANK = [
    'どうです？　俺は強くなりましたよ',
    '結果を出すのは当然です',
    'お任せください。最良の結果を、主に',
  ];

  // 4段階評価
  // 1) 200点未満、またはおはぎ5個以上 → LOW
  // 2) 200～349点 → NORMAL
  // 3) 350～449点 → GOOD
  // 4) 450点以上 → BEST
  let pool;
  if (score < 200 || ohagiCount >= 5){
    pool = LOW_RANK;
  } else if (score >= 450){
    pool = BEST_RANK;
  } else if (score >= 350){
    pool = GOOD_RANK;
  } else {
    pool = NORMAL_RANK;
  }

  const rank = '🍆「' + pool[Math.floor(Math.random()*pool.length)] + '」';
  document.getElementById('resultScore').textContent = `${score} てん`;

  const missText = missed ? `💧 とりこぼし×${missed}` : '✨ 完全受領';
  document.getElementById('resultDetail').innerHTML =
    `💗×${hearts} ／ 🌙×${moons}<br>` +
    `🔥 さいだい${maxCombo}コンボ ／ ${missText}<br>` +
    `<img src="ohagi.png" alt="" style="width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:3px;">おはぎ×${ohagiCount}`;

  document.getElementById('resultRank').textContent = rank;
  const BTN_LINES = [
    'まだ行けますよ。死ななきゃ安い',
    '拝命いたしましょう',
    '主の思うままに',
    '主命とあらば',
    'おまかせあれ。なんでも斬って差し上げましょう',
    '何をしましょうか。ご随意にどうぞ',
  ];
  document.getElementById('retryBtn').textContent = BTN_LINES[Math.floor(Math.random()*BTN_LINES.length)];
  document.getElementById('resultBest').textContent = `ベストスコア: ${best}`;
  document.getElementById('resultOverlay').classList.remove('hidden');
  updateHUD();
}

// ===== 開始 =====
function startGame(){
  score=0; combo=0; maxCombo=0; hearts=0; moons=0; missed=0; ohagiCount=0;
  items=[]; fx=[]; bubble=null; hesiBubble=null;
  throwIn=40; rushOn=false; rushShown=false; rushCued=false; rushHold=0; rushBannerT=0;
  rushMikaSaid=false; introStage=1; introT=60; hesiCatchSaid=false;
  ohagiPauseUntil=0; ohagiPauseLast=0; rushOhagiT=0;
  happyT=0; smileT=0; mikaPoseT=0; mikaThrowDir=1; hesiMoveDir=0; frame=0;
  hx=W/2; tx=W/2; mx=W/2; mTarget=W/2;
  startTime=0; timeLeft=GAME_TIME;
  playing=true;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('cvWrap').classList.remove('hidden');
  document.getElementById('resultOverlay').classList.add('hidden');
  updateHUD();
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}

// ===== 入力 =====
function pointerX(e){
  const rect=cv.getBoundingClientRect();
  // max-height + object-fit:contain で左右に余白が出る場合を補正
  const scale = Math.min(rect.width/W, rect.height/H);
  const drawnW = W*scale;
  const padX = (rect.width - drawnW)/2;
  return (e.clientX - rect.left - padX) / scale;
}
cv.addEventListener('pointerdown', e=>{ if(playing && introStage===0) tx=pointerX(e); });
cv.addEventListener('pointermove', e=>{ if(playing && introStage===0 && (e.buttons||e.pointerType==='touch')) tx=pointerX(e); });
let keyDir=0;
document.addEventListener('keydown', e=>{
  if (e.code==='ArrowLeft'){ e.preventDefault(); keyDir=-1; }
  if (e.code==='ArrowRight'){ e.preventDefault(); keyDir=1; }
});
document.addEventListener('keyup', e=>{
  if (e.code==='ArrowLeft'&&keyDir<0) keyDir=0;
  if (e.code==='ArrowRight'&&keyDir>0) keyDir=0;
});
setInterval(()=>{ if(keyDir&&playing&&introStage===0) tx=Math.max(20,Math.min(W-20,tx+keyDir*14)); }, 16);

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

render(); updateHUD();

</script>
